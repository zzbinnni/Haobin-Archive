<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAOBIN Archive</title>
<meta name="description" content="장하오 × 성한빈 / 늘빈 作品索引">
<style>
:root{--bg:#faf7fa;--paper:#fffdfd;--pink:#eadbe4;--blue:#dbe8f0;--blue2:#c8dce8;--ink:#4f5661;--muted:#8d929b;--line:#e5dfe5;--accent:#758ca0;--rose:#a98598;--shadow:0 10px 30px rgba(93,92,105,.07)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fbf8fb 0%,#f6f9fb 100%);color:var(--ink);font:15px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1120px;margin:auto;padding:28px 18px 60px}
header{padding:28px 8px 22px;position:relative}.tiny{font-size:12px;letter-spacing:.16em;color:var(--rose);font-weight:700}.title{font-size:clamp(34px,7vw,62px);line-height:1;margin:9px 0 8px;letter-spacing:-.04em;color:#596472}.sub{color:var(--muted);font-size:14px}
.doodle{position:absolute;right:12px;top:20px;font-size:25px;letter-spacing:9px;opacity:.58;max-width:250px;text-align:right}
.panel{background:rgba(255,253,253,.78);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.controls{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:10px}
input,select{width:100%;border:2px solid #e8e2e8;border-radius:14px;padding:12px 13px;background:#fff;color:var(--ink);outline:none;font:inherit}
input:focus,select:focus{border-color:var(--blue2);box-shadow:0 0 0 4px rgba(200,220,232,.25)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0 0}.chip{padding:6px 10px;border-radius:999px;background:#f1e9ef;border:1px solid #e4d7df;color:#7d7180;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:18px;transition:.18s transform,.18s box-shadow,.18s border-color;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d7dfe5}.num{position:absolute;right:15px;top:14px;color:#b4b5bb;font-size:11px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:#edf3f6;color:#718394}.tag.pink{background:#f4e9ef;color:#967c8c}
h2{font-size:19px;line-height:1.35;margin:6px 30px 4px 0;color:#525c68}.cn{font-size:13px;color:#9a8a94;margin-bottom:10px}
.meta{font-size:13px;color:#777f88;display:grid;gap:3px}.meta b{font-weight:600;color:#69727d}
.open{display:inline-block;margin-top:13px;padding:8px 12px;border-radius:12px;background:#e7f0f4;color:#627b8c;text-decoration:none;font-weight:650;border:1px solid #d7e4ea}.open:hover{background:#dceaf0}
.empty{text-align:center;padding:55px 10px;color:var(--muted);display:none}.foot{text-align:center;margin-top:30px;color:#a0a2a8;font-size:12px}
@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.doodle{position:static;margin-top:18px;text-align:left}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="tiny">HAOBIN ARCHIVE</div>
  <div class="title">늘빈 · 하오빈</div>
  <div class="sub">장하오 × 성한빈｜原站入口与书目信息索引</div>
  <div class="doodle">🦊 🐹 🐬 🐕 🎻 🐾</div>
</header>

<section class="panel">
  <div class="controls">
    <input id="q" placeholder="搜索标题、作者、设定……">
    <select id="order"><option value="">全部顺序</option><option>장하오×성한빈</option><option>성한빈×장하오</option><option>늘빈</option></select>
    <select id="type"><option value="">全部类型</option><option>长篇</option><option>连载</option><option>完结</option><option>短篇</option></select>
    <select id="setting"><option value="">全部设定</option><option>现代</option><option>校园</option><option>历史/宫廷</option><option>末世</option><option>游戏</option><option>其他</option></select>
  </div>
  <div class="stats"><span class="chip" id="count"></span><span class="chip">仅收录原站入口</span><span class="chip">不搬运正文</span></div>
</section>

<div id="grid" class="grid"></div>
<div id="empty" class="empty">没有找到匹配作品 🐾</div>
<div class="foot">资料会继续整理｜链接以原站为准</div>
</div>

}
